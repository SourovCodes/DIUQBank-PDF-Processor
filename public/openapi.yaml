openapi: 3.1.0
info:
  title: PDF Processor API
  version: 1.0.0
  description: Simple PDF compression and watermarking API backed by Ghostscript and FPDI.
servers:
  - url: /
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    Error:
      type: object
      required:
        - message
      properties:
        message:
          type: string
paths:
  /api/pdfs/compress:
    post:
      summary: Compress a PDF
      description: Compresses the uploaded PDF with Ghostscript using the ebook preset.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - pdf
              properties:
                pdf:
                  type: string
                  format: binary
      responses:
        '200':
          description: Compressed PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          description: Invalid or missing API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation or processing error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/pdfs/watermark-compress:
    post:
      summary: Watermark and compress a PDF
      description: Adds a top-header text watermark to every page, then compresses the PDF with Ghostscript using the ebook preset.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - pdf
                - watermark_text
              properties:
                pdf:
                  type: string
                  format: binary
                watermark_text:
                  type: string
                  maxLength: 255
      responses:
        '200':
          description: Watermarked and compressed PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          description: Invalid or missing API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation or processing error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
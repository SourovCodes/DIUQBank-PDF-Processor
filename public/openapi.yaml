openapi: 3.1.0
info:
  title: PDF Processor API
  version: 1.0.0
  description: Simple PDF compression and watermarking API backed by Ghostscript and FPDI.
servers:
  - url: /
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    Error:
      type: object
      required:
        - message
      properties:
        message:
          type: string
paths:
  /api/pdfs/compress:
    post:
      summary: Compress a PDF
      description: Compresses the uploaded PDF with Ghostscript using the ebook preset.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - pdf
              properties:
                pdf:
                  type: string
                  format: binary
      responses:
        '200':
          description: Compressed PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          description: Invalid or missing API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation or processing error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/pdfs/extract-pages:
    post:
      summary: Extract pages from a PDF
      description: |
        Returns a new PDF containing only the requested pages, in the order they were
        provided. Duplicates are removed (first occurrence wins) so the endpoint can also
        be used to reorder pages.

        The `pages` field accepts either:

        - a comma-separated string with optional ranges, e.g. `"1,3,5-7"`, or
        - a repeated form array, e.g. `pages[]=1&pages[]=3&pages[]=5`.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - pdf
                - pages
              properties:
                pdf:
                  type: string
                  format: binary
                pages:
                  oneOf:
                    - type: string
                      example: "1,3,5-7"
                      description: Comma-separated 1-indexed page numbers with optional ranges.
                    - type: array
                      items:
                        type: integer
                        minimum: 1
                      example: [1, 3, 5]
                      description: Array of 1-indexed page numbers in desired output order.
      responses:
        '200':
          description: PDF containing the requested pages
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          description: Invalid or missing API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation or processing error (e.g. requested page out of range)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/pdfs/watermark-compress:
    post:
      summary: Watermark and compress a PDF
      description: Adds a top-header text watermark to every page, then compresses the PDF with Ghostscript using the ebook preset.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - pdf
                - watermark_text
              properties:
                pdf:
                  type: string
                  format: binary
                watermark_text:
                  type: string
                  maxLength: 255
      responses:
        '200':
          description: Watermarked and compressed PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          description: Invalid or missing API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation or processing error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'